# The app on Fly.io: one small machine in Tokyo.
#
# The app's name is not written here: it lives in app.json, and the
# workflows pass it as --app <name>-dan. Deploys and removal go through
# .github/workflows/, never from a session's shell.

primary_region = "nrt"   # Tokyo

[build]

[env]
  PORT = "8080"
  # Crash reporting (lib/crash.js, public/crash.js): this DSN is public by Sentry's design (https://docs.sentry.io/concepts/key-terms/dsn-explainer/).
  SENTRY_DSN = "https://b4cc0e1e4b6df3c350a64bc86b05abab@o4512315716993024.ingest.de.sentry.io/4512320323911760"

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: a sleeping machine would cost a cold start on every look.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/alive"

[mounts]
  source = "kanji_data"
  destination = "/data"   # never change this path

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
