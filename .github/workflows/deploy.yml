# LOCAL PROPOSAL: not release-ready until deploy-target.json is independently verified.
# Existing app only. Password restaging and remote build compute require release approval.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      expected_workflow_sha:
        description: Full reviewed main commit containing this workflow
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_WORKFLOW_SHA: ${{ inputs.expected_workflow_sha }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Bind reviewed invocation before any Fly operation
        run: |
          node scripts/deploy-guard.cjs context
          echo "FLYCTL_VERSION=$(jq -r .flyctlVersion scripts/deploy-target.json)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run the checks
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Read the app's name
        run: |
          name=$(jq -r .name app.json)
          [ "$name" = "kanji-study" ] || exit 1
          echo "APP=$name-dan" >> "$GITHUB_ENV"
          echo "The Fly app is $name-dan."

      - uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: ${{ env.FLYCTL_VERSION }}

      - name: Refuse to run without the secrets
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          missing=""
          [ -z "$FLY_API_TOKEN" ] && missing="$missing FLY_API_TOKEN"
          [ -z "$APP_PASSWORD" ] && missing="$missing APP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. Add them under Settings > Secrets and variables > Actions, then re-run. Nothing deployed."
            exit 1
          fi
          echo "Required repository secrets are present: FLY_API_TOKEN, APP_PASSWORD."

      - name: Require existing healthy machine, attached volume and deployed secret names
        run: node scripts/deploy-guard.cjs inventory

      # The passphrase follows the repository secret on every deploy, so
      # changing APP_PASSWORD in GitHub and re-running this resets it.
      - name: Set the passphrase from the repository secret
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          flyctl secrets set --app "$APP" --stage "APP_PASSWORD=$APP_PASSWORD" >/dev/null
          echo "APP_PASSWORD staged from the repository secret."

      - name: Deploy
        run: flyctl deploy --remote-only --app "$APP" --only-machines 8654724c923dd8 --update-only --no-public-ips --ha=false --deploy-retries 0 --env "COMMIT=${GITHUB_SHA::7}"

      - name: Check the alive line
        run: |
          base="https://$APP.fly.dev"
          code=000
          for i in $(seq 1 12); do
            code=$(curl -s -o /tmp/alive.txt -w '%{http_code}' "$base/alive" || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          echo "alive: status $code"
          echo "alive: $(cat /tmp/alive.txt 2>/dev/null)"
          if [ "$code" != "200" ] || ! grep -q "^alive since .* · ${GITHUB_SHA::7}$" /tmp/alive.txt; then
            echo "::error::$base/alive did not answer 200 with this commit's alive line."
            exit 1
          fi

      # As a person would: open the sign-in page, send the form with the
      # passphrase, keep the cookie it gives, open the sample screen.
      - name: Sign in through the sign-in form
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          base="https://$APP.fly.dev"
          jar=$(mktemp)
          trap 'rm -f "$jar"' EXIT
          stranger=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "$base/status")
          echo "status page without a cookie: $stranger"
          case "$stranger" in "303 $base/login"*) ;; *) echo "::error::The status page did not send a stranger to sign-in."; exit 1 ;; esac
          curl -s -o /tmp/login.html "$base/login"
          if ! grep -q '<form class="login" method="post" action="/login">' /tmp/login.html; then
            echo "::error::The sign-in page carries no sign-in form."
            exit 1
          fi
          login=$(curl -s -c "$jar" -o /dev/null -w '%{http_code}' \
            --data-urlencode "passphrase=$APP_PASSWORD" --data-urlencode "next=/" "$base/login")
          echo "sign-in form: HTTP $login"
          cookie=$(awk '$6 ~ /_auth$/ {print $6}' "$jar")
          expiry=$(awk '$6 ~ /_auth$/ {print $5}' "$jar")
          if [ -n "$cookie" ]; then
            echo "cookie: $cookie, expires $(date -u -d "@$expiry" '+%Y-%m-%d %H:%M UTC')"
          else
            echo "cookie: none"
          fi
          page=$(curl -s -b "$jar" -o /tmp/home.html -w '%{http_code}' "$base/")
          if [ "$login" = "303" ] && [ -n "$cookie" ] && [ "$page" = "200" ] && grep -q '<body data-page="catch">' /tmp/home.html; then
            echo "signed in: yes (Catch page: HTTP $page)"
          else
            echo "signed in: no (Catch page: HTTP $page)"
            echo "::error::Signing in through the form with APP_PASSWORD did not reach the Catch page."
            exit 1
          fi
          echo "Live at $base"

      # At most one deliberate test POST per invocation. No automatic retry.
      # HTTP500 is not proof of Sentry delivery; storage is checked separately.
      # A fresh dispatch still needs fresh authorization and a once-only ledger.
      - name: One approved crash POST (HTTP observation only)
        id: crash_test_once
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          base="https://$APP.fly.dev"
          jar=$(mktemp)
          trap 'rm -f "$jar"' EXIT
          # a connection that fails or times out is 000 here, never the step's exit code
          login=$(curl -s -o /dev/null -w "%{http_code}" -c "$jar" --max-time 30 \
            --data-urlencode "passphrase=$APP_PASSWORD" --data-urlencode "next=/" "$base/login") || login="${login:-000}"
          echo "sign-in form: HTTP $login"
          code=000
          if [ "$login" = "303" ]; then
            code=$(curl -s -o /dev/null -w "%{http_code}" -b "$jar" -X POST -H 'accept: application/json' --max-time 30 "$base/crash-test") || code="${code:-000}"
          fi
          echo "crash-test: $code"
          if [ "$code" != "500" ]; then echo "::warning::POST /crash-test answered $code (sign-in $login), not 500; the crash may not have reached Sentry."; fi
