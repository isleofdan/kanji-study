<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explore · {{TITLE}}</title>
<link rel="stylesheet" href="/app.css">
</head>
<body data-page="explore">
<header class="bar">
  <a class="name" href="/">{{TITLE}}</a>
  <nav><a href="/">Catch</a><a href="/explore">Explore</a><a href="/yours">Yours</a><a href="/status">Status</a></nav>
</header>
<main>
  <h1>Explore</h1>
  <section id="themes-part">
    <h2>Themes</h2>
    <ul class="lines" id="themes"></ul>
  </section>
  <section id="ask-part">
    <h2>Ask</h2>
    <label for="question">A question or a theme to start from</label>
    <textarea id="question" maxlength="500" placeholder="characters I would meet on temple plaques"></textarea>
    <p class="muted counter" id="counter" hidden></p>
    <div id="ask-out"><button class="btn" type="button" id="ask">Explore</button></div>
  </section>
  <section id="earlier-part" hidden>
    <h2>Earlier</h2>
    <ul class="lines" id="earlier"></ul>
  </section>
</main>
<script src="/js/common.js"></script>
<script src="/js/explore.js"></script>
</body>
</html>
